# Redis config — ThiagoMKT
# Usado para: cache de respostas IA, filas BullMQ, sessões

# Persistência
save 60 1000
save 300 100
save 900 1

# Memória máxima
maxmemory 256mb
maxmemory-policy allkeys-lru

# Log
loglevel notice

# Timeout de conexão ociosa (0 = sem timeout)
timeout 0

# Keep-alive TCP
tcp-keepalive 300

# Número de bancos de dados
databases 16

# Lazy freeing (para DEL/FLUSH sem bloquear)
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# AOF (Append Only File) para durabilidade
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
